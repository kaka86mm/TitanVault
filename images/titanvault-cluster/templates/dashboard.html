<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TitanVault Cluster</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0c; --bg-elevated: #101014; --surface: #16161c; --surface-hover: #1e1e26;
  --fg: #f0f0f4; --fg-2: #a0a0b0; --fg-muted: #68687a;
  --border: #262630; --border-subtle: #1a1a22;
  --accent: #3b9eff; --accent-glow: rgba(59,158,255,0.15); --accent-subtle: rgba(59,158,255,0.08);
  --success: #22d37c; --success-dim: rgba(34,211,124,0.12);
  --warn: #f5a623; --warn-dim: rgba(245,166,35,0.12);
  --danger: #f05a5a; --danger-dim: rgba(240,90,90,0.12);
  --radius: 12px; --radius-sm: 8px;
  --font-body: Inter, system-ui, sans-serif; --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--bg); color: var(--fg); line-height: 1.5; }
::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Header — 跟 titanvault-homepage 一致 */
.header {
  background: var(--bg-elevated); border-bottom: 1px solid var(--border);
  padding: 16px 24px; display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px);
}
.header-logo { display: flex; align-items: center; gap: 10px; }
.header-logo svg { width: 28px; height: 28px; }
.header h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.header-badge {
  background: var(--accent-subtle); color: var(--accent);
  padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500;
  border: 1px solid var(--border);
}
.container { max-width: 960px; margin: 0 auto; padding: 24px 20px; }

/* Section */
.section { margin-bottom: 32px; }
.section-title {
  font-size: 13px; font-weight: 600; color: var(--fg-muted);
  text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px;
  display: flex; align-items: center; gap: 6px;
}

/* Node cards */
.nodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.node-card {
  background: var(--surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius); padding: 18px; transition: border-color 0.2s;
}
.node-card:hover { border-color: var(--border); }
.node-card.self { border-color: var(--accent); background: linear-gradient(135deg, var(--accent-subtle), var(--surface)); }
.node-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.node-name { font-size: 14px; font-weight: 600; }
.node-name .icon { margin-left: 6px; font-size: 14px; }
.role-tag {
  padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.role-master { background: var(--success-dim); color: var(--success); }
.role-worker { background: var(--accent-glow); color: var(--accent); }
.role-idle { background: var(--surface-hover); color: var(--fg-muted); }
.node-info { font-size: 12px; color: var(--fg-muted); font-family: var(--font-mono); margin-bottom: 12px; }
.node-bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.bar-label { width: 50px; color: var(--fg-muted); flex-shrink: 0; }
.bar-track { flex: 1; height: 5px; background: var(--border-subtle); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.fill-vram { background: var(--accent); }
.fill-ram { background: var(--success); }
.fill-warn { background: var(--warn); }
.bar-value { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); width: 80px; text-align: right; flex-shrink: 0; }
.node-flags { font-size: 11px; color: var(--fg-muted); margin-top: 10px; }
.node-flags span { margin-right: 8px; }

/* Model list */
.model-list { display: flex; flex-direction: column; gap: 6px; }
.model-item {
  background: var(--surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm); padding: 12px 14px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; transition: all 0.15s;
}
.model-item:hover { background: var(--surface-hover); border-color: var(--border); }
.model-item.selected { border-color: var(--accent); background: var(--accent-subtle); }
.model-name { font-size: 13px; font-weight: 500; }
.model-meta { font-size: 11px; color: var(--fg-muted); margin-top: 2px; font-family: var(--font-mono); }
.model-size {
  font-family: var(--font-mono); font-size: 12px; color: var(--fg-2);
  background: var(--surface-hover); padding: 3px 8px; border-radius: 4px;
}

/* Plan preview */
.plan-box {
  background: var(--surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius); padding: 16px; margin-top: 12px;
}
.plan-title { font-size: 12px; font-weight: 600; color: var(--fg-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
.plan-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 1px solid var(--border-subtle); font-size: 13px;
}
.plan-row:last-child { border-bottom: none; }
.plan-node { font-weight: 500; }
.plan-layers { color: var(--accent); font-family: var(--font-mono); font-size: 12px; }

/* Buttons */
.btn {
  padding: 8px 16px; border: none; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font-body);
  transition: opacity 0.15s;
}
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-ghost { background: var(--surface-hover); color: var(--fg-2); border: 1px solid var(--border); }

/* Deploy status */
.deploy-banner {
  padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px;
  display: flex; align-items: center; gap: 8px;
}
.deploy-active { background: var(--success-dim); color: var(--success); }
.deploy-error { background: var(--danger-dim); color: var(--danger); }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--fg-muted); font-size: 13px; }
.spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
.flex { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
<div class="header">
  <div class="header-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M2 12h3M19 12h3M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"/>
    </svg>
    <h1>TitanVault Cluster</h1>
  </div>
  <span class="header-badge" id="clusterBadge">连接中</span>
</div>
<div class="container">
  <div class="section">
    <div class="section-title">集群节点</div>
    <div id="nodesGrid" class="nodes-grid">
      <div class="loading"><div class="spinner"></div>正在发现节点</div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">部署模型</div>
    <div id="deployStatus" style="margin-bottom:12px"></div>
    <div id="modelList" class="model-list">
      <div class="loading"><div class="spinner"></div>加载模型</div>
    </div>
    <div id="planPreview"></div>
    <div class="flex" style="margin-top:14px">
      <button class="btn btn-primary" id="deployBtn" onclick="deployModel()" disabled>部署</button>
      <button class="btn btn-danger" id="undeployBtn" onclick="undeploy()" style="display:none">停止</button>
      <button class="btn btn-ghost" onclick="loadModels()">刷新</button>
    </div>
  </div>
</div>
<script>
let ws=null,clusterData=null,selectedModel=null,deployState={deployed:false};
function esc(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML}
function connectWS(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage=e=>{const msg=JSON.parse(e.data);if(msg.type==='cluster_status'){clusterData=msg.data;renderCluster()}else if(msg.type==='deployment_update'){deployState=msg.data;renderDeploy()}};
  ws.onclose=()=>setTimeout(connectWS,3000);
}
connectWS();
function renderCluster(){
  const grid=document.getElementById('nodesGrid');
  const badge=document.getElementById('clusterBadge');
  if(!clusterData?.nodes)return;
  badge.textContent=`${clusterData.node_count} 节点`;
  grid.innerHTML=clusterData.nodes.map(n=>{
    const vpct=n.vram_total_gb>0?Math.round(n.vram_used_gb/n.vram_total_gb*100):0;
    const rpct=n.ram_total_gb>0?Math.round(n.ram_used_gb/n.ram_total_gb*100):0;
    const vc=vpct>80?'fill-warn':'fill-vram';
    const rc=rpct>80?'fill-warn':'fill-ram';
    const rt=n.role==='master'?'主节点':n.role==='worker'?'计算节点':'空闲';
    const rc2=`role-${n.role}`;
    return `<div class="node-card ${n.is_self?'self':''}">
      <div class="node-header"><div class="node-name">${esc(n.hostname)} <span class="icon">${n.is_self?'🏠':'🔗'}</span></div><div class="role-tag ${rc2}">${rt}</div></div>
      <div class="node-info">${esc(n.ip)}:${n.port} · ${esc(n.node_id)}</div>
      <div class="node-bars">
        <div class="bar-row"><div class="bar-label">VRAM</div><div class="bar-track"><div class="bar-fill ${vc}" style="width:${vpct}%"></div></div><div class="bar-value">${n.vram_used_gb}/${n.vram_total_gb}GB</div></div>
        <div class="bar-row"><div class="bar-label">RAM</div><div class="bar-track"><div class="bar-fill ${rc}" style="width:${rpct}%"></div></div><div class="bar-value">${n.ram_used_gb}/${n.ram_total_gb}GB</div></div>
      </div>
      <div class="node-flags">
        ${n.llama_cpp_available?'<span>✅ llama.cpp</span>':'<span>❌ llama.cpp</span>'}
        ${n.rpc_server_available?'<span>✅ RPC</span>':'<span>❌ RPC</span>'}
        ${n.llama_server_running?'<span>🟢 server</span>':''}
        ${n.rpc_server_running?'<span>🟢 rpc</span>':''}
      </div>
    </div>`;
  }).join('');
}
async function loadModels(){
  try{
    const r=await fetch('/api/models');if(!r.ok)return;const d=await r.json();
    const el=document.getElementById('modelList');
    if(!d.models?.length){el.innerHTML='<div class="loading">未找到本地推理模型</div>';return}
    el.innerHTML=d.models.map((m,i)=>`<div class="model-item ${selectedModel===m.path?'selected':''}" data-path="${esc(m.path)}" onclick="selectModel(this.dataset.path,${i})">
      <div><div class="model-name">${esc(m.name)}</div><div class="model-meta">${m.layers||'?'}层 · 建议 ${m.recommended_vram_gb}GB VRAM</div></div>
      <div class="model-size">${m.size_gb}GB</div>
    </div>`).join('');
    window._models=d.models;
  }catch(e){}
}
function selectModel(path,i){selectedModel=path;document.querySelectorAll('.model-item').forEach((el,n)=>el.classList.toggle('selected',n===i));previewPlan(path);document.getElementById('deployBtn').disabled=false}
async function previewPlan(path){
  try{const r=await fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model_path:path})});
    if(!r.ok)return;const p=await r.json();
    const ws=p.workers.map(w=>`<div class="plan-row"><span class="plan-node">🔗 ${esc(w.node_id)} (${esc(w.ip)})</span><span class="plan-layers">${w.layers}层</span></div>`).join('');
    document.getElementById('planPreview').innerHTML=`<div class="plan-box"><div class="plan-title">部署方案</div>
      <div class="plan-row"><span class="plan-node">🏠 ${esc(p.master_node_id)} (主节点)</span><span class="plan-layers">${p.master_local_layers}层</span></div>${ws}
      <div class="plan-row"><span style="color:var(--fg-muted)">-ts ${esc(p.tensor_split)}</span><span class="plan-layers">-ngl ${p.ngl}</span></div></div>`;
  }catch(e){document.getElementById('planPreview').innerHTML=''}
}
async function deployModel(){
  if(!selectedModel)return;const b=document.getElementById('deployBtn');b.disabled=true;b.textContent='部署中...';
  try{const r=await fetch('/api/deploy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model_path:selectedModel})});
    const res=await r.json();if(!res.deployed)alert('部署失败')}catch(e){alert('出错:'+e)}
  b.disabled=false;b.textContent='部署'
}
async function undeploy(){await fetch('/api/undeploy',{method:'POST'})}
function renderDeploy(){
  const el=document.getElementById('deployStatus');const b=document.getElementById('undeployBtn');
  if(deployState.deployed){el.innerHTML=`<div class="deploy-banner deploy-active">✅ 集群推理服务运行中 · API http://${location.hostname}:8082/v1</div>`;b.style.display=''}
  else{el.innerHTML='';b.style.display='none'}
}
loadModels();
</script>
</body>
</html>
